<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command palette</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Noto+Sans+Symbols+2&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="app" data-theme="{{theme}}" style="width: 100%; height: 100vh; min-height: 720px; position: relative; overflow: hidden; background: var(--bg)">
<dc-import name="GamesLive" theme="{{theme}}" hint-size="100%,100%"></dc-import>
<div style="position: absolute; inset: 0; background: var(--scrim); display: flex; justify-content: center; align-items: flex-start; padding-top: 120px">
<div role="dialog" aria-modal="true" aria-label="Command palette" style="width: 640px; max-width: calc(100% - 32px); border-radius: 14px; background: var(--s2); border: 1px solid var(--line); box-shadow: var(--shadow-3); overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 56px; border-bottom: 1px solid var(--line)">
<svg class="icon icon-20" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--tx3)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
<label for="cp-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Command</label>
<input id="cp-q" value="fl" style="flex: 1; height: 40px; border: 0; outline: 0; background: transparent; color: var(--tx); font: 400 16px/24px 'Inter', sans-serif">
<span class="kbd">Esc</span>
</div>
<div style="padding: 8px; display: flex; flex-direction: column; gap: 2px; max-height: 420px; overflow-y: auto">
<span class="eyebrow" style="padding: 8px 10px 4px">Actions</span>
<div class="row sel" style="height: 40px"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--acc)"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg><span style="flex: 1"><strong style="font-weight: 600">Fl</strong>ip board</span><span class="kbd">F</span></div>
<div class="row" style="height: 40px"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--tx3)"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg><span style="flex: 1">Resign game (<strong style="font-weight: 600">fl</strong>ag)</span><span class="meta">vs Reckless</span></div>
<div class="row" style="height: 40px"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--tx3)"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span style="flex: 1">Settings: Board and pieces › <strong style="font-weight: 600">Fl</strong>at board (0° tilt)</span></div>
<span class="eyebrow" style="padding: 12px 10px 4px">Library</span>
<div class="row" style="height: 40px"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--tx3)"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span style="flex: 1">Folder: <strong style="font-weight: 600">Fl</strong>ank openings</span><span class="meta tnum">27 games</span></div>
<div class="row" style="height: 40px"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--tx3)"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="9" r="2"/><path d="M6 7v10M18 11c0 4-4 4-10 7"/></svg><span style="flex: 1">Study: Réti vs King’s Indian, <strong style="font-weight: 600">fl</strong>exible setups</span><span class="meta">Edited yesterday</span></div>
</div>
<div style="display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--tx3)">
<span style="display: flex; align-items: center; gap: 6px"><span class="kbd">↑</span><span class="kbd">↓</span>Move</span>
<span style="display: flex; align-items: center; gap: 6px"><span class="kbd">↵</span>Run</span>
<span style="display: flex; align-items: center; gap: 6px"><span class="kbd">⌘↵</span>Open in new tab</span>
<span style="flex: 1"></span>
<span>Type <span class="kbd">&gt;</span> for commands only</span>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
