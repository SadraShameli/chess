<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New game dialog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Noto+Sans+Symbols+2&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="app" data-theme="{{theme}}" style="width: 100%; height: 100vh; min-height: 720px; position: relative; overflow: hidden; background: var(--bg)">
<dc-import name="GamesOverview" theme="{{theme}}" hint-size="100%,100%"></dc-import>
<div style="position: absolute; inset: 0; background: var(--scrim); display: flex; justify-content: center; align-items: center; padding: 16px">
<div role="dialog" aria-modal="true" aria-labelledby="ng-title" style="width: 560px; max-width: 100%; border-radius: 14px; background: var(--s2); border: 1px solid var(--line); box-shadow: var(--shadow-3); display: flex; flex-direction: column">
<div style="display: flex; align-items: center; padding: 18px 20px 6px">
<h2 id="ng-title" style="flex: 1; margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">New game</h2>
<button class="btn btn-ghost btn-sm btn-icon" type="button" aria-label="Close"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>
<div style="padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 20px">

<div class="field"><span class="label">Opponent</span>
<div class="seg wide" role="radiogroup" aria-label="Opponent"><button type="button" class="on">Reckless engine</button><button type="button">Two players, this computer</button></div>
</div>

<div class="field"><span class="label">Time control</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px" role="radiogroup" aria-label="Time control">
<sc-for list="{{times}}" as="t" hint-placeholder-count="8">
<button type="button" class="btn" style="height: 52px; flex-direction: column; gap: 0; background: {{t.bg}}; border-color: {{t.border}}; color: {{t.fg}}"><span class="tnum" style="font-size: 15px; font-weight: 600">{{t.tc}}</span><span style="font-size: 11px; font-weight: 400; color: var(--tx3)">{{t.kind}}</span></button>
</sc-for>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div class="field"><span class="label">Play as</span>
<div class="seg wide" role="radiogroup" aria-label="Play as"><button type="button">White</button><button type="button" class="on">Random</button><button type="button">Black</button></div>
</div>
<div class="field"><span class="label">Variant</span>
<div class="seg wide" role="radiogroup" aria-label="Variant"><button type="button" class="on">Standard</button><button type="button">Chess960</button></div>
</div>
</div>

<div class="field">
<div style="display: flex; align-items: baseline"><label class="label" for="ng-str" style="flex: 1">Engine strength</label><span class="tnum" style="font-weight: 600">Level 7 <span style="font-weight: 400; color: var(--tx3)">· about 2100</span></span></div>
<input id="ng-str" type="range" min="1" max="10" value="7" style="width: 100%; accent-color: var(--acc)">
<div class="tnum" style="display: flex; justify-content: space-between; font-size: 11px; color: var(--tx3)"><span>1 · beginner</span><span>10 · full strength</span></div>
</div>

<label style="display: flex; align-items: center; gap: 10px; color: var(--tx2)"><input type="checkbox" checked="" style="width: 16px; height: 16px; accent-color: var(--acc)">Allow takebacks</label>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line)">
<span style="flex: 1; font-size: 12px; color: var(--tx3)">Opens in a new tab. You can run several games at once.</span>
<a href="GamesOverview.dc.html" class="btn btn-ghost" style="text-decoration: none">Cancel</a>
<a href="GamesLive.dc.html" class="btn btn-primary" style="text-decoration: none">Start game <span class="kbd" style="background: transparent; color: inherit; border-color: currentColor; opacity: 0.6">↵</span></a>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = '5+3';
    const times = [
      ['1+0', 'Bullet'], ['3+2', 'Blitz'], ['5+3', 'Blitz'], ['10+0', 'Rapid'],
      ['15+10', 'Rapid'], ['30+0', 'Classical'], ['None', 'Untimed'], ['Custom', '…'],
    ].map(([tc, kind]) => ({
      tc, kind,
      bg: tc === sel ? 'var(--acc-soft)' : 'var(--s1)',
      border: tc === sel ? 'var(--acc)' : 'var(--line)',
      fg: tc === sel ? 'var(--acc)' : 'var(--tx)',
    }));
    return { theme: this.props.theme ?? 'dark', times };
  }
}
</script>
</body>
</html>
