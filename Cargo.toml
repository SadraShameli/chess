[package]
name = "chess"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
default-run = "chess"

[[bin]]
name = "chess-tools"
path = "tools/main.rs"

[[test]]
name = "native"
path = "tests/native.rs"
harness = false
test = false

[[test]]
name = "assets"
path = "tests/assets.rs"
required-features = ["asset-tools"]

[features]
asset-tools = ["dep:boolmesh", "dep:earcutr", "dep:gltf-json"]
native-test = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_log", "bevy_gltf", "bevy_pbr", "bevy_winit", "scene", "mesh_picking", "mouse", "keyboard", "reflect_auto_register", "tonemapping_luts", "zstd_rust", "x11", "wayland", "accesskit_unix"] }
bevy_egui = { version = "=0.43.1", default-features = false, features = ["render", "accesskit", "manage_clipboard"] }
boolmesh = { version = "=0.2.1", default-features = false, optional = true }
directories = "=6.0.0"
earcutr = { version = "=0.5.0", optional = true }
gltf-json = { version = "=1.4.1", features = ["names"], optional = true }
interprocess = { version = "=2.4.5", default-features = false, features = ["tokio"] }
pgn-reader = "=0.29.1"
rayon = "=1.12.0"
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
same-file = "=1.0.6"
rusqlite = { version = "=0.40.2", features = ["backup", "bundled"] }
schemars = { version = "=1.2.3", features = ["uuid1"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
shakmaty = "=0.30.2"
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-wdio = { version = "=1.5.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.28.0", features = ["serde", "v4"] }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }

[target.'cfg(target_os = "windows")'.dependencies]
win-sd = { version = "=0.3.1", default-features = false }
winapi-util = "=0.1.11"
windows-permissions = "=0.2.4"
widestring = "=1.0.2"
winsafe = { version = "=0.0.29", default-features = false, features = ["advapi"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
exacl = { version = "=0.13.0", default-features = false }

[dev-dependencies]
egui_kittest = { version = "=0.36.0", default-features = false }
tokio = { version = "=1.53.3", features = ["test-util"] }

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"
unreachable_pub = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
expect_used = "deny"
implicit_clone = "deny"
inefficient_to_string = "deny"
large_futures = "deny"
large_stack_arrays = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
mutex_atomic = "deny"
option_option = "deny"
panic = "deny"
rc_mutex = "deny"
redundant_clone = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
wildcard_imports = "deny"

[profile.release]
opt-level = 3
lto = "thin"
debug = "line-tables-only"
overflow-checks = true

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
